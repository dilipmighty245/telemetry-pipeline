# Central Cluster Configuration - Collectors and API Gateway
# This configuration deploys collectors, API gateway, and database for central processing

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []

# Image configuration
image:
  registry: docker.io
  repository: telemetry-pipeline
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC
rbac:
  create: true

# Pod Security Context
podSecurityContext:
  fsGroup: 65534
  runAsNonRoot: true
  runAsUser: 65534

# Security Context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

# Streamer Configuration - DISABLED for central cluster
streamer:
  enabled: false

# Collector Configuration - ENABLED for central cluster
collector:
  enabled: true
  replicaCount: 5  # Higher capacity for central processing
  
  image:
    repository: telemetry-pipeline-collector
    tag: ""
    pullPolicy: ""
  
  config:
    batchSize: 200  # Larger batches for central processing
    pollInterval: "1s"
    bufferSize: 2000
    logLevel: "info"
  
  resources:
    limits:
      cpu: 1500m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  
  # Central cluster node selection
  nodeSelector:
    node-type: cpu
  
  tolerations:
  - key: high-memory
    operator: Exists
    effect: NoSchedule
  
  # Prefer high-memory nodes for processing
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: memory-type
            operator: In
            values: ["high-memory"]
    # Anti-affinity to spread collectors across nodes
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/component
              operator: In
              values: ["collector"]
          topologyKey: kubernetes.io/hostname
  
  podAnnotations:
    cluster-role: "central-collector"
  podLabels:
    deployment-type: "central"

# API Gateway Configuration - ENABLED for central cluster
apiGateway:
  enabled: true
  replicaCount: 3
  
  image:
    repository: telemetry-pipeline-api-gateway
    tag: ""
    pullPolicy: ""
  
  config:
    port: 8080
    logLevel: "info"
  
  service:
    type: LoadBalancer  # Expose externally
    port: 80
    targetPort: 8080
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
  
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/rate-limit: "100"
      nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    hosts:
      - host: telemetry-api.company.com  # Replace with actual domain
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: api-gateway-tls
        hosts:
          - telemetry-api.company.com
  
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 300m
      memory: 256Mi
  
  nodeSelector:
    node-type: cpu
  
  podAnnotations:
    cluster-role: "central-api"
  podLabels:
    deployment-type: "central"



# External etcd Configuration - REQUIRED for cross-cluster
externalEtcd:
  enabled: true
  endpoints:
    - "etcd.shared-infra.company.com:2379"  # Replace with actual etcd endpoints
  auth:
    enabled: true
    username: "telemetry-user"
    password: ""  # Set via --set or external secret
    existingSecret: "etcd-auth"
    existingSecretPasswordKey: "password"
  tls:
    enabled: true
    skipVerify: false
    caCert: ""  # CA certificate for TLS verification

# etcd Configuration - DISABLED for central cluster (using external etcd)
etcd:
  enabled: false

# Monitoring - Comprehensive monitoring for central cluster
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: ""
    labels:
      cluster-type: "central"
    interval: 15s  # More frequent monitoring
    scrapeTimeout: 10s

# Horizontal Pod Autoscaler - Aggressive scaling for central cluster
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15  # Higher scaling for central processing
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Custom metrics for message queue lag
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

# Pod Disruption Budget - Higher availability requirements
podDisruptionBudget:
  enabled: true
  minAvailable: 2  # Ensure multiple replicas always available

# Network Policies - Secure central cluster communication
networkPolicy:
  enabled: true
  ingress:
  # Allow ingress from edge clusters (streamers via etcd)
  - from: []
    ports:
    - protocol: TCP
      port: 2379
  # Allow ingress to API Gateway
  - from: []
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow egress to external etcd
  - to: []
    ports:
    - protocol: TCP
      port: 2379
    - protocol: TCP
      port: 2380  # etcd peer port
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

# Common labels for central cluster
commonLabels:
  cluster-type: "central"
  deployment-pattern: "distributed"

# Common annotations
commonAnnotations:
  deployment.kubernetes.io/cluster-role: "central-processing"

# Extra manifests for central-specific resources
extraManifests:
- |
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: central-cluster-info
    namespace: {{ .Release.Namespace }}
  data:
    cluster-type: "central"
    role: "data-processing"
    components: "collector,api-gateway,etcd"
    etcd-endpoint: "{{ index .Values.externalEtcd.endpoints 0 }}"

# Backup configuration for central cluster
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: "30d"
  storage:
    type: "s3"
    bucket: "telemetry-backups"
    region: "us-west-2"
    accessKey: ""  # Set via secret
    secretKey: ""  # Set via secret

# Resource quotas for central cluster
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "10"
    requests.memory: "20Gi"
    limits.cpu: "20"
    limits.memory: "40Gi"
    persistentvolumeclaims: "10"
    services.loadbalancers: "2"
